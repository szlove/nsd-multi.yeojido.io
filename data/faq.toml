[[items]]
  question = "엘론은 낙성대에서 어디쯤인가요?"
  answer = "낙성대 다국적노래방 엘론은 서울 관악구 봉천동에 있어요. 여러 국적 직원이 함께 응대해 낯선 조합의 모임도 편하게 안내받을 수 있어요."
[[items]]
  question = "낙성대 엘론은 몇 시부터 이용할 수 있나요?"
  answer = "매일 18:00에 열어 다음날 15:00까지 쉬지 않고 운영해요."
[[items]]
  question = "이용 전 연락은 어떻게 하나요?"
  answer = "010-7456-5410으로 문의하시면 여러 국적의 직원이 응대 가능 여부를 확인해 안내해 드려요."
[[items]]
  question = "가격대가 어떻게 구성되나요?"
  answer = "인원 기준으로 1인 10만원, 2인 16만원, 3인 24만원, 4인 32만원이며 방 크기에 따라 안내가 달라질 수 있어요."
